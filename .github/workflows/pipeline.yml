name: Football Predictor Pipeline

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde GitHub con un botón

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el Pipeline Completo
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          python main.py
          python -m src.utils.export_for_powerbi

      - name: 5. Guardar cambios en el repositorio (DuckDB, Modelos y CSV PowerBI)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git status
          git diff-index --quiet HEAD || git commit -m "auto: actualización diaria de datos y predicciones [skip ci]"
          git push