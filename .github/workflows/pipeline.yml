name: Football Predictor Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'        # lunes a las 06:00 UTC
  workflow_dispatch:           # ejecución manual desde la pestaña Actions
    inputs:
      train:
        description: 'Reentrenar modelos'
        type: boolean
        default: false

permissions:
  contents: write             # necesario para subir los CSV

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar el pipeline completo
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          mkdir -p data/raw data/models data/powerbi
          if [ "${{ inputs.train }}" = "true" ]; then
            python main.py --train
          else
            python main.py
          fi

      - name: 5. Subir datos y CSV al repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "auto: actualización semanal de datos y predicciones"
            git pull --rebase
            git push
          fi